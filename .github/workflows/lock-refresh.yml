name: Composer Lock Refresh

on:
  pull_request:
    paths:
      - composer.json
      - composer.lock
      - .github/workflows/lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Refresh lock for the minimum PHP platform
        run: composer update --no-interaction --prefer-dist

      - name: Validate refreshed dependency state
        run: composer validate --strict

      - name: Commit refreshed lock to task branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: refresh Composer lock for PHP 7.4"
          git push origin "HEAD:${{ github.head_ref }}"
