name: Thumbnail Manager CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      intensity: ${{ steps.classify.outputs.intensity }}
      full: ${{ steps.classify.outputs.full }}
      quality: ${{ steps.classify.outputs.quality }}
      integration: ${{ steps.classify.outputs.integration }}
      plugin_check_applicable: ${{ steps.classify.outputs.plugin_check_applicable }}
      plugin_check: ${{ steps.classify.outputs.plugin_check }}
      javascript: ${{ steps.classify.outputs.javascript }}
      matrix: ${{ steps.classify.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify affected validation surfaces
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          git diff --name-only "$BASE_SHA...HEAD" > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"

          minimum_wp="$(awk -F': ' '/^Requires at least:/ {print $2; exit}' readme.txt)"
          tested_wp="$(awk -F': ' '/^Tested up to:/ {print $2; exit}' readme.txt)"
          test -n "$minimum_wp"
          test -n "$tested_wp"

          python3 bin/classify-ci.py \
            --event-name "${{ github.event_name }}" \
            --pr-draft "${{ github.event.pull_request.draft || false }}" \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --minimum-wp "$minimum_wp" \
            --tested-wp "$tested_wp" \
            --github-output "$GITHUB_OUTPUT"

  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repository metadata and workflow contracts
        run: python3 tests/repository-contract-tests.py

      - name: Release tooling regression tests
        run: python3 tests/test_release_tooling.py

      - name: Diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [[ "${{ github.event_name }}" == "push" && -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}...HEAD"
          else
            git diff --check HEAD^..HEAD
          fi

  quality:
    name: Coding standards
    needs:
      - classify
    if: ${{ needs.classify.outputs.quality == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Check PHP syntax
        shell: bash
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Resolve Composer download cache
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-download-${{ runner.os }}-php-8.2-${{ hashFiles('composer.lock') }}

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist

      - name: WordPress and PHP compatibility standards
        run: composer phpcs

  javascript:
    name: JavaScript syntax
    needs:
      - classify
    if: ${{ needs.classify.outputs.javascript == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        shell: bash
        run: find js -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Run JavaScript contracts
        run: node --test tests/js/*.test.mjs

  phpunit:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    needs:
      - classify
    if: ${{ needs.classify.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: PHP 7.4 syntax baseline
        if: ${{ matrix.label == 'minimum' }}
        shell: bash
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Resolve Composer download cache
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-download-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install WordPress source and test library
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 "${{ matrix.wordpress }}"

      - name: PHPUnit
        run: composer test
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib

      - name: PHPUnit multisite storage and deactivation
        if: ${{ matrix.label == 'tested-modern' }}
        run: composer test -- --filter test_multisite_
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_MULTISITE: 1

  plugin-check:
    name: WordPress Plugin Check
    needs:
      - classify
    if: ${{ needs.classify.outputs.plugin_check == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Build exact distributable plugin payload
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^[[:space:]]*\*[[:space:]]*Version:/ {print $3; exit}' thumbnail-manager.php)"
          test -n "$version"
          bash bin/build-release.sh \
            --source . \
            --output-dir "$RUNNER_TEMP/plugin-check-build" \
            --version "$version" \
            --source-sha "$GITHUB_SHA" \
            --preparation-run-id "$GITHUB_RUN_ID"

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ${{ runner.temp }}/plugin-check-build/staged/thumbnail-manager
          slug: thumbnail-manager
          # Current WordPress drift is monitored separately; PR validation
          # must not rewrite the published Tested up to header just to go green.
          ignore-codes: outdated_tested_upto_header
          strict: false

      - name: Enforce reviewed Plugin Check warning baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 bin/validate-plugin-check.py \
            --results "$RUNNER_TEMP/plugin-check-results.txt" \
            --baseline release/plugin-check-baseline.json

  ci-gate:
    # Only final-mode runs emit the stable branch-protection signal. Draft runs
    # emit Iteration Gate, so a cheaper draft result cannot satisfy CI Gate.
    name: ${{ needs.classify.outputs.full == 'true' && 'CI Gate' || 'Iteration Gate' }}
    if: ${{ always() }}
    needs:
      - classify
      - repository-contracts
      - quality
      - javascript
      - phpunit
      - plugin-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Require every applicable validation job
        env:
          CLASSIFY: ${{ needs.classify.result }}
          QUALITY_REQUIRED: ${{ needs.classify.outputs.quality }}
          INTEGRATION_REQUIRED: ${{ needs.classify.outputs.integration }}
          JAVASCRIPT_REQUIRED: ${{ needs.classify.outputs.javascript }}
          PLUGIN_CHECK_REQUIRED: ${{ needs.classify.outputs.plugin_check }}
          CONTRACTS: ${{ needs.repository-contracts.result }}
          QUALITY: ${{ needs.quality.result }}
          JAVASCRIPT: ${{ needs.javascript.result }}
          PHPUNIT: ${{ needs.phpunit.result }}
          PLUGIN_CHECK: ${{ needs.plugin-check.result }}
        shell: bash
        run: bash bin/validate-ci-gate.sh
